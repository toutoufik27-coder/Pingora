name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cohost
          POSTGRES_PASSWORD: cohost
          POSTGRES_DB: cohost_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cohost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (embedded database)
        run: npm run test:e2e
      - name: Migrate Postgres
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://cohost:cohost@localhost:5432/cohost_test
      - name: End-to-end tests (Postgres)
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgres://cohost:cohost@localhost:5432/cohost_test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
